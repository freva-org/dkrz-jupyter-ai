[build-system]
requires = ["hatchling>=1.4.0", "hatch-nodejs-version"]
build-backend = "hatchling.build"

[project]
name = "jupyter_climateclaw"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
description = "A Jupyter AI extension for ClimateClaw."
authors = [
    { name = "Felix Oertel", email = "oertel@dkrz.de" },
]
dependencies = [
    "dkrz_jupyter_ai>=0.1.0,<1.0.0",
    "climateclaw_client>=0.2.2",
    "py-oidc-auth-client==2603.0.1",
    "aiofiles",
    "nest_asyncio",
]

[project.optional-dependencies]
test = ["coverage", "pytest", "pytest-asyncio", "pytest-cov"]

[project.entry-points."jupyter_ai.model_providers"]
jupyter-climateclaw = "jupyter_climateclaw.provider:ClimateClawProvider"

[project.entry-points."jupyter_ai.chat_handlers"]
login-slash-command = "jupyter_climateclaw.slash_command:LoginSlashCommand"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.hooks.version]
path = "jupyter_climateclaw/_version.py"

[tool.check-wheel-contents]
ignore = ["W002"]
