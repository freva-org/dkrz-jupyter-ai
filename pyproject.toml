[build-system]
requires = ["hatchling>=1.4.0", "jupyterlab~=4.0", "hatch-nodejs-version"]
build-backend = "hatchling.build"

[project]
name = "dkrz_jupyter_ai_monorepo"
dynamic = ["version", "description", "authors", "urls", "keywords"]
requires-python = ">=3.9"
dependencies = [
  "dkrz-jupyter-ai-magics @ {root:uri}/packages/jupyter-ai-magics",
  "dkrz-jupyter-ai @ {root:uri}/packages/jupyter-ai",
  "jupyter-climateclaw @ {root:uri}/packages/jupyter-climateclaw",
]

[project.optional-dependencies]
build = []

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "BSD 3-Clause License"

[tool.hatch.version]
source = "nodejs"
path = "package.json"

[tool.hatch.build]
packages = ["packages/jupyter-ai-magics", "packages/jupyter-ai", "packages/jupyter-climateclaw"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.check-manifest]
ignore = [".*"]

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.pytest.ini_options]
addopts = "--ignore packages/jupyter-ai-module-cookiecutter"

[tool.mypy]
exclude = ["tests"]
